<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>房型好评生成器 · 酒店评价小助手</title>
<style>
  :root {
    --primary: #f6a821;
    --primary-dark: #d98f16;
    --primary-soft: #fff6e5;
    --ink: #1a1a1a;
    --gray-6: #666;
    --gray-9: #999;
    --line: #eee;
    --bg: #f6f6f6;
    --card: #fff;
    --radius: 16px;
    --shadow: 0 2px 14px rgba(0,0,0,0.06);
    --ok: #2ecc71;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); font-size:14px;
    overscroll-behavior:none;
  }

  .page { display:none; min-height:100vh; max-width:430px; margin:0 auto; flex-direction:column; position:relative; }
  .page.active { display:flex; animation:pageIn .25s ease; }
  @keyframes pageIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--bg); position:sticky; top:0; z-index:20; }
  .topbar .title { font-size:17px; font-weight:700; }
  .topbar .sub-btn { background:var(--primary-soft); border:none; color:var(--primary-dark); font-size:13px; font-weight:600; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .topbar.has-back { justify-content:flex-start; gap:4px; }
  .topbar.has-back .back { display:block; }
  .topbar .back { display:none; background:none; border:none; font-size:20px; color:var(--ink); cursor:pointer; padding:2px 10px; line-height:1; }

  .footer-bar { position:sticky; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:12px; }
  .btn { flex:1; border:none; border-radius:24px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; text-align:center; transition:transform .12s, opacity .2s; }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.4; }
  .btn.primary { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; box-shadow:0 6px 18px rgba(246,168,33,.35); }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn.secondary { background:var(--ink); color:#fff; }

  .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); }
  .hint { font-size:12px; color:var(--gray-9); }
  .content { flex:1; padding:4px 16px 20px; }

  /* 房型卡片 */
  .room-card { margin-bottom:16px; overflow:hidden; }
  .room-head { display:flex; align-items:center; gap:12px; padding:16px; cursor:pointer; }
  .room-emoji { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .room-info { flex:1; }
  .room-name { font-size:16px; font-weight:700; }
  .room-sub { font-size:12px; color:var(--gray-9); margin-top:2px; }
  .room-check { width:24px; height:24px; border-radius:50%; border:2px solid #ddd; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
  .room-card.selected .room-check { background:var(--primary); border-color:var(--primary); }
  .room-card.selected { border:2px solid var(--primary); box-shadow:0 4px 16px rgba(246,168,33,.18); }

  /* 房型缩略图 */
  .room-thumbs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 16px 14px; max-height:368px; overflow-y:auto; }
  .tthumb { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#eee; }
  .tthumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .tthumb .del { position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; }
  .tthumb .idx { position:absolute; left:4px; top:4px; background:rgba(0,0,0,.55); color:#fff; font-size:10px; padding:1px 5px; border-radius:6px; }
  .tthumb.add { border:1.5px dashed #ccc; background:#fafafa; display:flex; align-items:center; justify-content:center; color:var(--gray-9); font-size:12px; cursor:pointer; }
  .tthumb.add .plus { font-size:24px; color:#ccc; line-height:1; }

  /* 空房型提示 */
  .room-empty { text-align:center; color:var(--gray-9); font-size:13px; padding:20px; border:1.5px dashed #eee; border-radius:12px; margin:0 16px 14px; cursor:pointer; }
  .room-empty .demo-btn { display:inline-block; margin-top:10px; background:var(--primary-soft); color:var(--primary-dark); padding:6px 14px; border-radius:16px; font-size:12px; font-weight:600; }
  .demo-hint { display:flex; align-items:center; gap:6px; background:#fff8e1; border:1px solid #ffe082; color:#8b6914; font-size:12px; padding:9px 12px; border-radius:10px; margin-bottom:14px; line-height:1.5; }
  .cloud-stat { font-size:12px; padding:8px 12px; border-radius:10px; margin:10px 16px 0; line-height:1.5; background:#e8f4fd; border:1px solid #bbdefb; color:#1565c0; }
  .cloud-stat.ok { background:#e8f4fd; border-color:#bbdefb; color:#1565c0; }
  .cloud-stat.bad { background:#fdecea; border-color:#f5c6cb; color:#c62828; }

  /* 生成中 */
  .gen-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 24px; text-align:center; }
  .gen-orbit { position:relative; width:140px; height:140px; margin-bottom:30px; }
  .gen-orbit .core { position:absolute; inset:32px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(246,168,33,.4); animation:pulse 1.6s infinite; }
  .gen-orbit .core svg { width:42px; height:42px; stroke:#fff; }
  .gen-orbit .ring { position:absolute; inset:0; border:3px solid var(--primary-soft); border-top-color:var(--primary); border-radius:50%; animation:spin 1.2s linear infinite; }
  .gen-orbit .ring.r2 { inset:8px; animation-duration:1.8s; animation-direction:reverse; opacity:.7; }
  .gen-orbit .ring.r3 { inset:16px; animation-duration:2.4s; opacity:.4; }
  @keyframes spin { to{ transform:rotate(360deg);} }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .gen-progress { width:220px; height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:18px; }
  .gen-progress .bar { height:100%; width:0; background:linear-gradient(90deg, var(--primary), var(--primary-dark)); border-radius:3px; transition:width .3s; }
  .gen-status { font-size:16px; font-weight:600; margin-bottom:6px; }
  .gen-step { font-size:13px; color:var(--gray-9); min-height:18px; }
  .gen-room { display:inline-flex; align-items:center; gap:6px; background:var(--primary-soft); color:var(--primary-dark); padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; margin-bottom:20px; }
  .gen-picked { display:flex; gap:8px; margin-bottom:24px; }
  .gen-picked img { width:54px; height:54px; border-radius:10px; object-fit:cover; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.12); }

  /* 结果页 */
  .result-head { display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:14px; }
  .result-head .mini-imgs { display:flex; }
  .result-head .mini-imgs img { width:44px; height:44px; border-radius:8px; object-fit:cover; border:2px solid #fff; margin-right:-10px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .result-head .meta { flex:1; }
  .result-head .meta .t { font-size:15px; font-weight:700; }
  .result-head .meta .s { font-size:12px; color:var(--gray-9); margin-top:2px; }
  .score { font-size:24px; font-weight:800; color:var(--primary); }
  .score .sub { font-size:12px; color:var(--gray-9); font-weight:500; }

  .style-switch { display:flex; gap:8px; padding:4px 16px 12px; }
  .style-switch .pill { padding:7px 14px; border-radius:18px; background:#fff; border:1.5px solid var(--line); font-size:13px; cursor:pointer; }
  .style-switch .pill.active { background:var(--primary-soft); border-color:var(--primary); color:var(--primary-dark); font-weight:600; }

  .review-list { padding:0 16px 20px; display:flex; flex-direction:column; gap:12px; }
  .r-imgs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 16px 0; }
  .r-img { aspect-ratio:1; border-radius:8px; overflow:hidden; background:#eee; }
  .r-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .qr-row { display:flex; align-items:center; gap:14px; padding:12px 16px; background:#fafafa; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .qr-box { width:120px; height:120px; background:#fff; border:1px solid var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; overflow:hidden; }
  .card-qr { line-height:0; }
  .qr-tip { flex:1; }
  .qr-tip-title { font-size:13px; font-weight:600; color:#1a1a1a; margin-bottom:4px; }
  .qr-tip .hint { line-height:1.6; }
  .remain { display:flex; align-items:center; gap:8px; background:#f0faf0; border:1px solid #cdeccd; color:#2e7d32; font-size:12px; padding:9px 12px; border-radius:10px; }
  .remain.exhausted { background:#fff6e5; border-color:#ffe0a3; color:#b26a00; }
  .remain .r-btn { margin-left:auto; }
  .review-card { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:#fff; }
  .review-card .r-top { display:flex; align-items:center; gap:10px; padding:14px 16px 6px; }
  .review-card .r-avatar { width:32px; height:32px; border-radius:50%; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .review-card .r-name { font-size:13px; font-weight:600; flex:1; }
  .review-card .stars { color:var(--primary); font-size:13px; letter-spacing:1px; }
  .review-card .r-body { padding:6px 16px 12px; font-size:14px; line-height:1.75; color:#333; white-space:pre-wrap; }
  .review-card .r-foot { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-top:1px solid var(--line); font-size:12px; color:var(--gray-9); }
  .review-card .r-actions { display:flex; gap:6px; }
  .r-btn { border:none; background:var(--primary-soft); color:var(--primary-dark); padding:6px 12px; border-radius:14px; font-size:12px; cursor:pointer; font-weight:600; }
  .r-btn:active { transform:scale(.94); }
  .r-btn.dark { background:var(--ink); color:#fff; }

  .toast { position:fixed; left:50%; bottom:120px; transform:translateX(-50%) translateY(20px); background:rgba(0,0,0,.82); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; opacity:0; transition:all .3s; pointer-events:none; z-index:999; max-width:80%; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .lib-empty { text-align:center; padding:60px 30px; color:var(--gray-9); }
  .lib-empty .emoji { font-size:48px; margin-bottom:12px; opacity:.6; }
  .lib-item { padding:14px 16px; margin-bottom:12px; }
  .lib-item .time { font-size:12px; color:var(--gray-9); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .lib-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-left:6px; vertical-align:1px; }
  .lib-tag.fresh { background:#e8f7e8; color:#2e7d32; }
  .lib-tag.used { background:#f0f0f0; color:#999; }
  .lib-item.is-used .txt { opacity:.6; }
  .r-btn.ok { background:#2ecc71; border-color:#2ecc71; color:#fff; }
  .lib-item .txt { font-size:13px; line-height:1.7; color:#333; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .lib-item .txt.full { -webkit-line-clamp:unset; display:block; }
  .lib-item .lib-act { display:flex; gap:8px; margin-top:10px; }
  .lib-qr { display:flex; align-items:center; gap:12px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .lib-qr .qr-box { width:165px; height:165px; background:#fff; border:1px solid var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; padding:6px; flex-shrink:0; }
  .lib-qr .qr-tip { font-size:12px; color:var(--gray-9); line-height:1.6; }
  .lib-imgs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .lib-img { aspect-ratio:1; border-radius:8px; overflow:hidden; background:#eee; }
  .lib-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .lib-group { margin-bottom:16px; }
  .lib-group-head { display:flex; align-items:center; justify-content:space-between; padding:10px 4px; font-size:15px; font-weight:700; }
  .lib-section { margin-bottom:22px; }
  .lib-section-head { display:flex; align-items:center; justify-content:space-between; padding:11px 16px; border-radius:14px; font-weight:700; font-size:15px; margin-bottom:12px; }
  .lib-section-head.fresh { background:linear-gradient(135deg,#e6f7ea,#f2fbf4); color:#2e7d32; border:1px solid #c8e6c9; }
  .lib-section-head.used { background:#f5f5f5; color:#9e9e9e; border:1px solid #e4e4e4; }
  .lib-section-head .sec-count { font-size:12px; font-weight:600; opacity:.85; }
  .lib-section-empty { text-align:center; color:var(--gray-9); font-size:12px; padding:16px; background:#fafafa; border:1px dashed var(--line); border-radius:12px; }
  .lib-section.is-used-sec .lib-item { opacity:.72; }
  .lib-group-head { align-items:center; }
  .g-count { display:inline-block; padding:3px 12px; border-radius:12px; font-size:12px; font-weight:700; }
  .g-count.fresh { background:#e8f7e8; color:#2e7d32; border:1px solid #c8e6c9; }
  .g-count.used { background:#f0f0f0; color:#999; border:1px solid #e0e0e0; }
  .g-name { font-size:15px; font-weight:700; }

  /* 二维码弹窗 */
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:200; padding:24px; }
  .modal-mask.show { display:flex; }
  .modal { background:#fff; border-radius:18px; padding:24px 22px; width:100%; max-width:320px; text-align:center; }
  .modal .m-title { font-size:16px; font-weight:700; margin-bottom:4px; }
  .modal .m-sub { font-size:12px; color:var(--gray-9); margin-bottom:16px; }
  .qr-box { background:#fff; padding:12px; border:1px solid var(--line); border-radius:12px; display:inline-block; margin-bottom:14px; }
  #bigQRBox { display:flex; align-items:center; justify-content:center; }
  .modal .m-tip { font-size:12px; color:var(--gray-6); line-height:1.6; margin-bottom:16px; }
  .modal .m-close { width:100%; border:none; background:var(--ink); color:#fff; padding:12px; border-radius:22px; font-size:14px; font-weight:600; cursor:pointer; }
  .batch-options { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .batch-opt { border:1.5px solid var(--line); background:#fafafa; border-radius:12px; padding:14px 6px; text-align:center; cursor:pointer; transition:all .15s; }
  .batch-opt:active { transform:scale(.95); }
  .batch-opt .num { font-size:20px; font-weight:800; color:var(--ink); }
  .batch-opt .lbl { font-size:11px; color:var(--gray-9); margin-top:4px; }
  .batch-opt.disabled { opacity:.35; pointer-events:none; }
  .batch-input-row { display:flex; align-items:center; gap:10px; margin:6px 0 14px; }
  .batch-input-row input { flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font-size:18px; font-weight:700; text-align:center; outline:none; }
  .batch-input-row input:focus { border-color:var(--primary); }
  .batch-input-row .unit { font-size:14px; color:var(--gray-9); font-weight:600; }
  .batch-input-row .go-btn { border:none; background:var(--primary); color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .batch-input-row .go-btn:active { transform:scale(.95); }
</style>
</head>
<body>

<!-- ============ 房型图库页（主界面） ============ -->
<section id="page-upload" class="page active">
  <div class="topbar">
    <span class="title">房型好评生成器</span>
    <button class="sub-btn" onclick="goLib()">📚 评价库</button>
  </div>

  <div id="cloudStat" class="cloud-stat">☁️ 正在连接云端…</div>

  <div class="content" id="roomList"></div>

  <div class="footer-bar">
    <button class="btn ghost" id="batchBtn" onclick="openBatchModal()">批量生成</button>
    <button class="btn primary" id="genBtn" onclick="startGenerate()">请先选择房型</button>
  </div>
</section>

<!-- 批量数量选择弹窗 -->
<div class="modal-mask" id="batchModal">
  <div class="modal">
    <div class="m-title">批量生成好评</div>
    <div class="m-sub" id="batchSub">选择要生成的数量（无上限）</div>
    <div class="batch-input-row">
      <input type="number" id="batchCount" min="1" max="999" value="5" inputmode="numeric">
      <span class="unit">条</span>
      <button class="go-btn" onclick="doBatchGenerate(Math.max(1,parseInt(document.getElementById('batchCount').value)||1))">开始生成</button>
    </div>
    <div class="batch-options" id="batchOptions"></div>
    <div class="m-tip" id="batchTip">每条 3 张图 + 不重复文案；图库充足时图片组间不重复，不足时自动复用</div>
    <button class="m-close" onclick="closeBatchModal()">取消</button>
  </div>
</div>

<!-- ============ 生成中页 ============ -->
<section id="page-generating" class="page">
  <div class="topbar has-back">
    <button class="back" onclick="backToUpload()">‹</button>
    <span class="title">AI 生成中</span>
  </div>
  <div class="gen-wrap">
    <div class="gen-room" id="genRoomTag"></div>
    <div class="gen-picked" id="genPicked"></div>
    <div class="gen-orbit">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="core">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
    </div>
    <div class="gen-progress"><div class="bar" id="genBar"></div></div>
    <div class="gen-status" id="genStatus">正在读取房型图片</div>
    <div class="gen-step" id="genStep">从图库中选取图片…</div>
  </div>
</section>

<!-- ============ 结果页 ============ -->
<section id="page-result" class="page">
  <div class="topbar has-back">
    <button class="back" onclick="goUpload()">‹</button>
    <span class="title">生成结果</span>
  </div>

  <div class="result-head card">
    <div class="mini-imgs" id="miniImgs"></div>
    <div class="meta">
      <div class="t" id="resTitle">酒店好评</div>
      <div class="s" id="resMeta">基于图库任选 3 张生成</div>
    </div>
    <div class="score">5.0<span class="sub"> 分</span></div>
  </div>

  <div class="style-switch" id="styleSwitch"></div>
  <div id="remainBar" style="padding:0 16px 12px;"></div>
  <div class="review-list" id="reviewList"></div>

  <div class="footer-bar">
    <button class="btn ghost" onclick="reGenerate()">🔄 重新生成</button>
    <button class="btn primary" onclick="saveToLib()">⭐ 保存</button>
  </div>
</section>

<!-- 二维码弹窗 -->
<div class="modal-mask" id="qrModal">
  <div class="modal">
    <div class="m-title">扫码查看这条好评</div>
    <div class="m-sub">含评价文字与实拍图片</div>
    <div class="qr-box"><div id="bigQRBox" style="display:flex;align-items:center;justify-content:center;"></div></div>
    <div class="m-tip">📱 对方扫码后打开展示页，可查看好评全文与实拍图，并<b>长按图片一键保存到手机</b></div>
    <button class="m-close" onclick="closeQR()">关闭</button>
  </div>
</div>

<!-- ============ 评价库页 ============ -->
<section id="page-library" class="page">
  <div class="topbar has-back">
    <button class="back" onclick="goUpload()">‹</button>
    <span class="title">我的评价库</span>
  </div>
  <div class="content" id="libContent"></div>
</section>

<!-- 全局隐藏文件输入（按房型动态使用） -->
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<div class="toast" id="toast"></div>

<script src="lib/qrcode.min.js"></script>
<script>
/* ===================== 房型数据 ===================== */
const ROOMS = [

const USED_KEY = 'room_reviews_used';

// 加载/保存已用记录（本地缓存；权威数据在云端）
function loadUsed(){
  try{ const s=localStorage.getItem(USED_KEY); if(s) state.used=JSON.parse(s); }catch(e){ state.used={}; }
  // 确保每个房型都有结构
  ROOMS.forEach(r=>{
    if(!state.used[r.id]) state.used[r.id]={};
  });
}
function saveUsed(){ try{ localStorage.setItem(USED_KEY, JSON.stringify(state.used)); }catch(e){} }
// 标记某房型的某些句子为已用（本地 + 云端）
function markUsed(roomId, sentences){
  const u = state.used[roomId];
  sentences.forEach(s=>{
    const t = s.trim();
    if(t) u[t] = 1;
  });
  saveUsed();
  apiPost('/api/used/add', { roomId, sentences });  // 云端同步（失败不阻塞，下次同步校正）
}
// 判断句子是否已用
function isUsed(roomId, sentence){
  return state.used[roomId] && state.used[roomId][sentence.trim()];
}
// 获取某类别未用过的句子池
function avail(lib, roomId, cat){
  const pool = lib[cat] || [];
  const left = pool.filter(s=>!isUsed(roomId, s));
  return left.length ? left : pool; // 素材用尽时回退到全量
}
// 某房型全部素材是否用尽
function isExhausted(roomId){
  const room = ROOMS.find(r=>r.id===roomId);
  const lib = BED_LIB[room.bed];
  const allCats = ['open','mid','close','proMid','proClose','vivid'];
  return allCats.every(cat=>{
    const pool = lib[cat];
    return pool.length>0 && pool.every(s=>isUsed(roomId, s));
  });
}
// 重置某房型已用记录（本地 + 云端）
function resetUsed(roomId){
  state.used[roomId] = {};
  saveUsed();
  apiPost('/api/used/reset', { roomId });
}

/* ===================== 云端同步（多员工共享同一份数据） ===================== */
const SYNC_INTERVAL = 20000;   // 每20秒自动同步一次
let syncTimer = null;
let lastSnapshot = '';         // 上次云端数据快照（仅变化时刷新界面，不打断操作）

function apiPost(path, body){
  return fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) })
    .then(r=>r.json()).catch(()=>null);
}
// 应用服务器返回的房型图库
function applyRooms(rooms){
  ROOMS.forEach(r=>{ if(rooms && Array.isArray(rooms[r.id])) state.rooms[r.id] = rooms[r.id]; });
}
// 本地缓存（云端失败时的兜底显示）
function cacheLocal(){
  try{
    localStorage.setItem('room_reviews_lib', JSON.stringify(state.library));
    localStorage.setItem(USED_KEY, JSON.stringify(state.used));
  }catch(e){}
}
// 按当前所在页刷新显示
function rerenderCurrentPage(){
  const active = document.querySelector('.page.active');
  if(!active) return;
  if(active.id === 'page-upload') renderRooms();
  else if(active.id === 'page-library') loadLib();
}
// 更新顶部云同步状态条
function updateCloudStat(ok, d){
  const el = document.getElementById('cloudStat');
  if(!el) return;
  if(ok){
    const imgs = ROOMS.reduce((n,r)=>n+(d.rooms&&d.rooms[r.id]?d.rooms[r.id].length:0),0);
    el.innerHTML = `☁️ 云端同步中 · 全员共享：图库 ${imgs} 张 · 评价 ${d.library?d.library.length:0} 条`;
    el.className = 'cloud-stat ok';
  }else{
    el.innerHTML = '⚠️ 云端连接失败，正在重试…（当前显示本地缓存）';
    el.className = 'cloud-stat bad';
  }
}
// 拉取云端全量数据；有变化才刷新界面
function syncFromServer(render){
  return fetch('/api/data').then(r=>r.json()).then(d=>{
    if(!d){ updateCloudStat(false); return; }
    applyRooms(d.rooms);
    if(Array.isArray(d.library)) state.library = d.library;
    if(d.used){
      state.used = d.used;
      ROOMS.forEach(r=>{ if(!state.used[r.id]) state.used[r.id]={}; });  // 保障房型结构完整
    }
    cacheLocal();
    updateCloudStat(true, d);
    const snap = JSON.stringify([d.rooms, d.library, d.used]);
    const changed = snap !== lastSnapshot;
    lastSnapshot = snap;
    if(changed && render !== false) rerenderCurrentPage();
  }).catch(()=>updateCloudStat(false));
}
// 启动自动同步：定时 + 从后台切回前台时立即同步
function startAutoSync(){
  if(syncTimer) return;
  syncTimer = setInterval(()=>{
    if(document.visibilityState === 'visible') syncFromServer(true);
  }, SYNC_INTERVAL);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') syncFromServer(true);
  });
}

/* ===================== 图片工具 ===================== */
const SVG_BASE = `data:image/svg+xml;utf8,`;
function svgPlace(text, color){
  const c = encodeURIComponent(color||'#f0e4c8');
  return SVG_BASE + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="${c}"/><text x="100" y="115" font-size="20" text-anchor="middle">${text}</text></svg>`
  );
}

// 为指定房型填充示例图（每次点击补 9 张，数量无上限；上传到云端全员共享，图片哈希幂等不重复）
function fillDemo(roomId){
  const room = ROOMS.find(r=>r.id===roomId);
  const colors = ['#f6a821','#e74c3c','#27ae60','#2980b9','#8e44ad','#d35400','#16a085','#c0392b','#2c3e50'];
  const start = state.rooms[roomId].length;
  const n = 9;
  toast('☁️ 正在同步示例图到云端…');
  let done = 0, got = 0;
  const finish = ()=>{
    if(done < n) return;
    if(got){ syncFromServer(true); toast(`✅ 已为「${room.name}」填入示例图，全员共享`); }
    else toast('⚠️ 示例图上传失败，请检查网络');
  };
  for(let i=0;i<n;i++){
    const svg = svgPlace(`${room.emoji} ${room.name} 图${start+i+1}`, colors[(start+i) % colors.length]);
    // dataURL(svg utf8) → base64 dataURL
    fetch(svg).then(r=>r.blob()).then(b=>new Promise(res=>{
      const fr = new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b);
    })).then(durl=>apiPost('/api/img', { data:durl }))
      .then(res=>{ if(res && res.url){ got++; return apiPost('/api/rooms/add', { roomId, urls:[res.url] }); } })
      .then(()=>{}).catch(()=>{})
      .finally(()=>{ done++; finish(); });
  }
}

function selectRoom(id){
  state.selected = state.selected===id ? null : id;
  renderRooms();
}

function uploadFor(roomId){
  state.pendingRoom = roomId;
  const fi = document.getElementById('fileInput');
  fi.onchange = e => {
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    toast('☁️ 正在上传到云端…');
    let left = files.length, fail = 0;
    const finishOne = ()=>{
      if(left > 0) return;
      if(fail) toast(`⚠️ ${fail} 张上传失败，请重试`);
      else { syncFromServer(true); toast(`✅ 已上传 ${files.length} 张，全员共享`); }
    };
    files.forEach(f=>{
      const reader = new FileReader();
      reader.onload = ev => {
        // 压缩后上传云端（原图过大，压到1400px保证多端秒开）
        compressImage(ev.target.result, 1400, 0.82).then(durl=>{
          apiPost('/api/img', { data: durl }).then(res=>{
            if(res && res.url){
              return apiPost('/api/rooms/add', { roomId: state.pendingRoom, urls:[res.url] })
                .then(r=>{ if(!r || !r.ok) fail++; })
                .catch(()=>{ fail++; });
            } else { fail++; }
          }).catch(()=>{ fail++; })
          .finally(()=>{
            left--;
            if(left === 0){
              if(fail) toast(`⚠️ ${fail} 张上传失败，请重试`);
              else { syncFromServer(true); toast(`✅ 已上传 ${files.length} 张，全员共享`); }
            }
          });
        });
      };
      reader.readAsDataURL(f);
    });
    e.target.value='';
  };
  fi.click();
}

function removeImg(roomId, url){
  apiPost('/api/rooms/remove', { roomId, url }).then(r=>{
    if(r && r.ok){ applyRooms(r.rooms); renderRooms(); toast('已删除（全员同步）'); }
    else toast('⚠️ 删除失败');
  });
}
// 生成好评后，把用过（已入选某条好评）的图片从图库移除，避免重复选用
// 与句子 markUsed 逻辑一致：在“生成时”即生效（不依赖是否保存）
async function removeUsedImgs(roomId, urls){
  if(!roomId || !Array.isArray(urls) || !urls.length) return;
  const uniq = [...new Set(urls)].filter(Boolean);
  if(!uniq.length) return;
  // 本地立即移除并刷新界面（服务端为全员共享，需同步删除）
  const set = new Set(uniq);
  state.rooms[roomId] = (state.rooms[roomId] || []).filter(u => !set.has(u));
  renderRooms();
  // 顺序逐个移除：每次响应都会累加已删结果，避免并发回写导致图片回加
  for(const url of uniq){
    try{
      const r = await apiPost('/api/rooms/remove', { roomId, url });
      if(r && r.ok && r.rooms) applyRooms(r.rooms);
    }catch(e){}
  }
}

/* ===================== 生成逻辑 ===================== */
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick2(arr,n){ const out=[]; const pool=[...arr]; while(n--&&pool.length){ out.push(pool.splice(rand(0,pool.length-1),1)[0]); } return out; }

// 生成一条好评，返回 { text, used[] }；used 是实际用到的模板句子单元
// blocked 为本轮已占用的句子（避免同轮3条重复）
function composeReview(style, roomId, blocked){
  const room = ROOMS.find(r=>r.id===roomId);
  const lib = BED_LIB[room.bed];
  const usePro = style==='pro';
  const useVivid = style==='vivid';
  const used = [];

  // 选句：从可用池中取，排除全局已用 + 本轮已占用；尽量保证不重复
  function choose(pool){
    const global = pool.filter(s=> !isUsed(roomId,s) && !blocked.has(s));
    const round = global.length ? global : pool.filter(s=>!blocked.has(s));
    const final = round.length ? round : pool; // 完全用尽时兜底
    const s = pick(final);
    used.push(s);
    blocked.add(s);
    return s;
  }

  const open = choose((ROOM_OPEN[roomId]||[]).concat(lib.open));
  const midN = usePro ? 1 : rand(1,2);
  const mids = [];
  for(let i=0;i<midN;i++){
    mids.push(choose(usePro ? lib.proMid : lib.mid));
  }
  const closeCat = usePro ? 'proClose' : useVivid ? (Math.random()>0.5?'vivid':'close') : 'close';
  const close = choose(lib[closeCat]);
  return { text: `${open}，${mids.join('，')}。${close}！`, used };
}

// 生成一组（3种风格），3条之间互不重复，且排除全局已用
function generateBatch(roomId){
  const blocked = new Set();
  const results = STYLES.map(s=>{
    const { text, used } = composeReview(s.id, roomId, blocked);
    return { text, style:s.id, used };
  });
  // 统一标记本轮所有用到的句子为已用（持久化）
  const allUsed = [];
  results.forEach(r=>allUsed.push(...r.used));
  markUsed(roomId, allUsed);
  return results;
}

// 批量生成 N 条好评（数量无上限）：每条 3 张图 + 文字尽量不重复
function generateBatchReviews(roomId, count){
  const room = ROOMS.find(r=>r.id===roomId);
  const pool = [...state.rooms[roomId]];
  if(pool.length < 3){ toast('该房型至少需要 3 张图片'); return null; }

  // 图片分组：图库充足时组间不重复；不足时循环复用（每条内 3 张仍不重复）
  const groups = [];
  if(pool.length >= count*3){
    const shuffled = shuffle(pool);
    for(let i=0;i<count;i++) groups.push(shuffled.slice(i*3, i*3+3));
  } else {
    for(let i=0;i<count;i++) groups.push(pick2(pool, 3));
  }
  // 本次用到的图片立即从图库移除，避免后续生成重复选用
  removeUsedImgs(roomId, [...new Set(groups.flat())]);

  // 生成 count 条不重复好评（风格循环交替，共享 blocked 保证跨条不重复）
  const blocked = new Set();
  const results = groups.map((imgs,i)=>{
    const style = STYLES[i % STYLES.length].id;
    const { text, used } = composeReview(style, roomId, blocked);
    return { text, style, used, images: imgs };
  });
  // 标记所有用到的句子为已用
  const allUsed = [];
  results.forEach(r=>allUsed.push(...r.used));
  markUsed(roomId, allUsed);
  return results;
}

// 获取分享URL（用 item 自己的图片，文字单独POST）
function getShareUrl(item){
  // 已有分享ID：直接复用（二维码保持不变，扫码状态可跟踪）
  if(item.shareId){
    return Promise.resolve(location.origin + '/share.html#' + item.shareId);
  }
  const roomId = (item && item.roomId) || state.selected;
  const imgs = item.images && item.images.length ? item.images : state.picked3;
  const compress = Promise.all(imgs.slice(0,3).map(src=>compressImage(src, 700, 0.7)));
  return compress.then(compressed =>
    // 图片压缩后传云端存文件，分享数据只存 URL（防止 data.json 无限膨胀）
    Promise.all(compressed.map(d=>apiPost('/api/img', { data:d }).then(r=> (r && r.url) || d)))
  ).then(urls => {
    const payload = {
      room: nameOf(roomId),
      text: item.text,
      score: 5,
      images: urls,
      time: new Date().toLocaleDateString('zh-CN'),
    };
    return fetch('/api/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(r=>r.json()).then(res=>{
      if(res && res.url){
        item.shareId = res.id;  // 记住分享ID，评价库据此检测"是否被扫码过"
        return res.url;
      }
      return null;
    });
  });
}

// 用 qrcode-generator 生成标准可扫描的二维码 canvas（整数缩放 + 白边，无失真）
function buildQR(url, size){
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  const count = qr.getModuleCount();
  const scale = Math.max(1, Math.floor(size / count));
  const pad = scale * 2;               // 四周白边（quiet zone），保证可被扫描识别
  const px = count * scale + pad * 2;
  const canvas = document.createElement('canvas');
  canvas.width = px; canvas.height = px;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = '#000000';
  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){
      if(qr.isDark(r,c)) ctx.fillRect(c*scale + pad, r*scale + pad, scale, scale);
    }
  }
  return canvas;
}

// 在指定容器内渲染二维码（小尺寸），点击放大
function renderQRIn(container, url, size){
  container.innerHTML = '';

  holder.style.cursor = 'pointer';

  }catch(e){

  }
}

// 图片压缩（canvas 缩放 + JPEG）
function compressImage(dataUrl, maxSize, quality){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > maxSize || height > maxSize){
        const scale = maxSize / Math.max(width, height);
        width = Math.round(width*scale);
        height = Math.round(height*scale);
      }
      const c = document.createElement('canvas');
      c.width = width; c.height = height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ resolve(dataUrl); }; // 失败则用原图
    img.src = dataUrl;
  });
}

    const keys = [...roomOrder, ...others];
    const groupsHtml = keys.map(k=>{
      const g = grouped[k];
      const room = ROOMS.find(r=>r.id===k);
      const emoji = room ? room.emoji : '🏨';
      const itemsHtml = g.items.map(item=>{
        const iid = item.id;
        const imgs = item.images && item.images.length
          ? `<div class="lib-imgs">${item.images.map(src=>`<div class="lib-img"><img src="${src}" alt="房型图片" onerror="this.style.background='#eee'"></div>`).join('')}</div>`
          : '';
        const usedTag = item.used
          ? '<span class="lib-tag used">✔ 已使用</span>'
          : '<span class="lib-tag fresh">🆕 未使用</span>';
        return `<div class="lib-item card ${item.used?'is-used':''}" data-libid="${iid}">
          <div class="time"><span>🕐 ${item.time} ${usedTag}</span><span class="hint">${item.text.length}字</span></div>
          <div class="txt" id="libtxt-${iid}">${item.text}</div>
          ${imgs}
          <div class="lib-qr"><div class="qr-box"></div><span class="qr-tip">扫码查看评论并保存图片</span></div>
          <div class="lib-act">
            <button class="r-btn ${item.used?'':'ok'}" onclick="toggleUsed('${iid}')">${item.used?'恢复未用':'标记已用'}</button>
            <button class="r-btn" onclick="copyLib('${iid}')">复制</button>
            <button class="r-btn" onclick="toggleLibFull('${iid}')">展开</button>
            <button class="r-btn dark" onclick="delLib('${iid}')">删除</button>
          </div>
        </div>`;
      }).join('');
      return `<div class="lib-group">
        <div class="lib-group-head">
          <span class="g-name">${emoji} ${g.name}</span>
          <span class="g-count ${isUsed?'used':'fresh'}">${g.items.length} 条评价</span>
        </div>
        ${itemsHtml}
      </div>`;
    }).join('');
    return `<div class="lib-section ${isUsed?'is-used-sec':''}">${head}${groupsHtml}</div>`;
  };

  // ===== 第三步：未使用区在上，已使用区在下 =====
  wrap.innerHTML = renderSection(freshList, false) + renderSection(usedList, true);

  // 渲染完成后，为每条评价自动生成二维码（用各自房型+文字+图片）
  requestAnimationFrame(()=>{
    state.library.forEach(item=>{
      if(!item.id) return;
      const card = wrap.querySelector('.lib-item[data-libid="'+item.id+'"]');
      if(card) autoQR(card, item, 160);
    });
  });
}
// 按 id 查找评价条目（多端并发下索引会漂移，id 不会）
function libById(id){ return state.library.find(x=>x.id===id); }
function copyLib(id){
  const it = libById(id);
  if(it) navigator.clipboard.writeText(it.text).then(()=>toast('✅ 已复制')).catch(()=>toast('复制失败'));
}
function toggleLibFull(id){ const el=document.getElementById('libtxt-'+id); if(el) el.classList.toggle('full'); }
function delLib(id){
  apiPost('/api/library/delete', { id }).then(r=>{
    if(r && r.ok){
      state.library = state.library.filter(x=>x.id!==id);
      cacheLocal(); loadLib(); toast('已删除（全员同步）');
    }else toast('⚠️ 删除失败');
  });
}
// 切换评价的使用状态（未使用 ↔ 已使用，云端同步）
function toggleUsed(id){
  const it = libById(id);
  if(!it) return;
  apiPost('/api/library/toggle', { id }).then(r=>{
    if(r && r.ok){
      it.used = r.item.used;
      cacheLocal(); loadLib();
      toast(it.used ? '✔ 已标记为已使用' : '🆕 已恢复为未使用');
    }else toast('⚠️ 操作失败');
  });
}

/* ===================== Toast ===================== */
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

/* ===================== 初始化 ===================== */
if(localStorage.getItem('room_reviews_lib')) state.library=JSON.parse(localStorage.getItem('room_reviews_lib'));
loadUsed();
renderRooms();
// 云端同步：启动即拉取共享数据（覆盖本地缓存），并开启定时自动同步
syncFromServer(true);
startAutoSync();
</script>
